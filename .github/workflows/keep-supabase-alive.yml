name: Giữ Supabase không bị pause

on:
  schedule:
    # Chạy mỗi ngày lúc 02:00 UTC = khoảng 09:00 sáng giờ Việt Nam
    - cron: "0 2 * * *"

  # Cho phép bấm Run workflow để kiểm tra thủ công
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Gọi một truy vấn nhẹ tới Supabase
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/kt_trac_nghiem?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")

          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase ping thành công."
          else
            echo "Supabase trả về HTTP $HTTP_CODE."
            exit 1
          fi
