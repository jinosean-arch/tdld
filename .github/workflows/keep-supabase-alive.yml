name: Kiểm tra Supabase

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra Secret
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "SUPABASE_URL đang RỖNG"
            exit 1
          fi

          if [ -z "${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" ]; then
            echo "SUPABASE_PUBLISHABLE_KEY đang RỖNG"
            exit 1
          fi

          echo "SUPABASE_URL: OK"
          echo "SUPABASE_PUBLISHABLE_KEY: OK"

      - name: Gọi Supabase
        run: |
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}")

          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Supabase ping thành công."
          else
            echo "Supabase trả về HTTP $HTTP_CODE."
            exit 1
          fi
