# Giữ project Supabase không bị tạm ngưng (free tier tự pause sau 7 ngày không hoạt động).
# Cách dùng:
#   1. Tạo một repo GitHub bất kỳ (public hay private đều được, kể cả repo trống mới tạo).
#   2. Trong repo đó, tạo file đúng đường dẫn: .github/workflows/keep-supabase-alive.yml
#   3. Dán toàn bộ nội dung file này vào, commit + push lên GitHub.
#   4. Xong — không cần làm gì thêm. GitHub sẽ tự chạy theo lịch, kể cả khi không ai mở máy.
#
# Có thể bấm "Run workflow" trong tab Actions của repo để chạy thử ngay, không cần chờ tới lịch.

name: Giữ Supabase không bị pause

on:
  schedule:
    # Chạy vào 02:00 UTC mỗi thứ Hai (~09:00 sáng giờ Việt Nam) — còn dư thừa so với
    # ngưỡng 7 ngày không hoạt động, nên sẽ không bao giờ để project bị pause.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}  # cho phép bấm chạy thử bằng tay trong tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Gọi một truy vấn nhẹ tới Supabase để tạo hoạt động
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://qcoeksqqyqshyvlzkgvz.supabase.co/rest/v1/kt_trac_nghiem?select=id&limit=1" \
            -H "apikey: sb_publishable_3uc1687zAEGmEusCQSpQAQ_HXizJmhJ" \
            -H "Authorization: Bearer sb_publishable_3uc1687zAEGmEusCQSpQAQ_HXizJmhJ"
